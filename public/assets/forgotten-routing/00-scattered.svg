<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A data node fans one product filter to twelve shards</title>
  <desc id="desc">The search client hits a data node. That data node fans the search to all twelve primary shards. Masters are not on the path.</desc>
